<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12141f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jeu de blocs</title>
<style>
  html, body { margin: 0; height: 100%; background: #20241c; color: #c8d0b0; overflow: hidden;
    font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #cadre { flex: none; background: #3a4032; padding: 10px; border-radius: 10px 10px 26px 10px; box-shadow: 0 4px 0 #14170f; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #d8e8a0; }
  body.couleur #cadre { background: #2a2e3e; box-shadow: 0 4px 0 #0c0e16; }
  #barre { display: flex; gap: 10px; align-items: center; font-size: 13px; }
  #barre button, #btnStart { background: #3a4032; color: #c8d0b0; border: 2px solid #5a6350; border-radius: 14px;
    padding: 8px 14px; font: inherit; font-weight: 600; letter-spacing: 1px; }
  #barre button:active, #btnStart.actif { background: #5a6350; }
  #aideClavier { opacity: .6; }
  /* Taille des commandes tactiles : proportionnelle à la largeur de l'écran, avec un maximum */
  :root { --croix: min(140px, 34vw); --boutons: min(144px, 35vw); }
  /* Téléphone tenu en hauteur : commandes dans le quart du bas, l'écran de jeu prend le reste */
  body.portrait { --croix: min(140px, 34vw, 19vh); --boutons: min(144px, 35vw, 19vh); }
  body.portrait #app { justify-content: flex-end; gap: 6px; }
  body.portrait #cadre { margin: auto 0; padding: 6px; border-radius: 8px 8px 18px 8px; }
  body.portrait #barre button { padding: 5px 14px; font-size: 12px; }
  body.portrait #tactile { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #tactile { display: none; width: 100%; max-width: 460px; box-sizing: border-box; padding: 4px 4vw 12px;
    justify-content: space-between; align-items: center; }
  #croix { position: relative; width: var(--croix); height: var(--croix); flex: none; touch-action: none; }
  #croix i { position: absolute; background: #4a5240; border-radius: 8px; }
  #croix .h { left: 0; right: 0; top: 33.33%; height: 33.34%; }
  #croix .v { top: 0; bottom: 0; left: 33.33%; width: 33.34%; }
  #croix b { position: absolute; width: 33.34%; height: 33.34%; border-radius: 8px; }
  #croix[data-dir="haut"] .bh, #croix[data-dir="bas"] .bb, #croix[data-dir="gauche"] .bg, #croix[data-dir="droite"] .bd { background: #7c886a; }
  #croix .bh { left: 33.33%; top: 0; } #croix .bb { left: 33.33%; bottom: 0; }
  #croix .bg { left: 0; top: 33.33%; } #croix .bd { right: 0; top: 33.33%; }
  #boutons { position: relative; width: var(--boutons); height: calc(var(--boutons) * 0.94); flex: none; }
  .rond { position: absolute; width: 48%; height: 51%; border-radius: 50%; background: #6a2f45; color: #f0d8e0;
    border: 3px solid #3c1826; font-size: calc(var(--boutons) * 0.15); font-weight: 700; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .rond.actif { background: #a04a68; }
  #btnB { left: 0; bottom: 0; } #btnA { right: 0; top: 0; }
  body.tactile #tactile { display: flex; }
  body.tactile #aideClavier { display: none; }
  @media (hover: none), (pointer: coarse) { #tactile { display: flex; } #aideClavier { display: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="cadre"><canvas id="ecran" width="160" height="144"></canvas></div>
  <div id="barre">
    <button id="btnStart" type="button">START</button>
    <button id="btnSon" type="button">SON : OUI</button>
    <span id="aideClavier">Flèches · X · W/Z · Entrée · M</span>
  </div>
  <div id="tactile">
    <div id="croix"><i class="h"></i><i class="v"></i><b class="bh"></b><b class="bb"></b><b class="bg"></b><b class="bd"></b></div>
    <div id="boutons"><div class="rond" id="btnB">B</div><div class="rond" id="btnA">A</div></div>
  </div>
</div>
<script>
"use strict";
/* =====================================================================================
   RÉGLAGES — tout ce qui se modifie sans toucher au reste du code
   Les durées sont en « images » (1 image = 1/59,73 s, comme la console d'origine).
   ===================================================================================== */

// --- Nom du jeu : une seule ligne à changer (affiché sur l'écran titre et dans l'onglet)
const NOM_DU_JEU = "Kubiks";
const SOUS_TITRE = "JEU DE BLOCS";

// --- Palette : 4 teintes de vert, de la plus claire (0) à la plus foncée (3)
const PALETTE = ["#d8e8a0", "#98b048", "#486830", "#182810"];

// --- Mode COULEUR (choisi dans les réglages : ÉCRAN RÉTRO / COULEUR)
//     Interface sur fond sombre : 0 = fond, 1 = panneaux, 2 = texte secondaire, 3 = texte principal
const PALETTE_COULEUR = ["#12141f", "#2e3552", "#8a93b8", "#eef0f6"];
//     Scènes de récompense en couleur : 0 = le plus clair … 3 = ciel de nuit
const PALETTE_SCENES_COULEUR = ["#fff4d6", "#f4a03c", "#3f8a5a", "#141a3a"];
//     Une couleur par pièce : L, J, I, O, Z, S, T
const COULEURS_PIECES = ["#f08c28", "#3c6cf0", "#3cd0e8", "#f0d030", "#e83c3c", "#48c848", "#a050e0"];
const COULEUR_BLOCS_B = "#6a7088";   // blocs de départ du mode B et rideau de fin de partie
const COULEUR_MUR = "#2a3048";       // murs autour de la grille

// --- Cadence de la logique du jeu (images par seconde de la console d'origine)
const IMAGES_PAR_SECONDE = 59.73;

// --- Vitesse de chute : nombre d'images pour descendre d'une ligne, niveaux 0 à 20
const VITESSES = [53, 49, 45, 41, 37, 33, 28, 22, 17, 11, 10, 9, 8, 7, 6, 6, 5, 5, 4, 4, 3];
const NIVEAU_MAX = 20;          // la vitesse n'augmente plus au-delà
const LIGNES_PAR_NIVEAU = 10;   // un niveau de plus toutes les 10 lignes (mode A)

// --- Déplacement latéral quand on maintient une direction
const DAS_DELAI = 23;           // attente avant que la répétition commence (23 ou 24 selon les sources)

// --- Descente rapide manuelle (bas maintenu)

// --- Moment où la pièce se fige : aucun délai, elle se fige dès qu'elle devrait descendre et ne peut pas.

// --- Mode B
const LIGNES_MODE_B = 25;
const RANGEES_PAR_HAUTEUR = 2;      // hauteur 1 = 2 rangées de blocs, hauteur 5 = 10 rangées

// --- Rotation : 1 = le bouton A tourne dans le sens horaire, -1 = sens inverse (incertain : à inverser si besoin)

// --- Son
const VOLUME_GENERAL = 0.5;

// --- Touches du clavier (valeurs de « event.key »)
const TOUCHES = {

  a: ["x", "X", " "],                 // tourner (bouton A) / valider

// Texte d'aide affiché sur l'écran titre (à tenir à jour si on change les touches)
const AIDE_TOUCHES = [
  "< >    DEPLACER",
  "BAS    DESCENDRE",
  "X      TOURNER A",
  "W / Z  TOURNER B",
  "ENTREE START / PAUSE",
  "M      COUPER LE SON"
];

const AIDE_TACTILE = [
  "CROIX   DEPLACER",
  "BAS     DESCENDRE",
  "A / B   TOURNER",
  "START   JOUER / PAUSE",
  "SON     COUPER LE SON"
];

// --- Manette (API Gamepad du navigateur). Numéros de boutons de la disposition « standard » :
//     0 = bas (A Xbox / croix PlayStation), 1 = droite (B / rond), 2 = gauche (X / carré), 3 = haut (Y / triangle)
//     8 = Select/Back/Share, 9 = Start/Menu/Options, 12 à 15 = croix directionnelle (haut, bas, gauche, droite)
const MANETTE = {
  a: [0, 3],          // tourner (bouton A du jeu)
  b: [1, 2],          // tourner dans l'autre sens (bouton B du jeu)
  start: [9],         // démarrer / pause
  son: [8],           // couper ou remettre le son
  haut: [12], bas: [13], gauche: [14], droite: [15]
};
const MANETTE_STICK = true;        // true : le stick gauche sert aussi de croix directionnelle
const MANETTE_ZONE_MORTE = 0.5;    // le stick doit être poussé à plus de 50 % pour compter
const AIDE_MANETTE = [
  "CROIX   DEPLACER",
  "BAS     DESCENDRE",
  "A / Y   TOURNER A",
  "B / X   TOURNER B",
  "START   JOUER / PAUSE",
  "SELECT  COUPER LE SON"
];

// --- Meilleurs scores
const NB_SCORES = 5;
const CLE_SAUVEGARDE = "jeu-de-blocs-89";

// --- Affichage
const ECHELLE_ENTIERE = true;   // true : agrandissement en multiples entiers (pixels parfaitement nets)
const DISPOSITION_PORTRAIT = true; // true : sur téléphone tenu en hauteur, score et pièce suivante passent
                                   // au-dessus de la grille pour qu'elle soit plus grande

// --- Musiques originales. Notation : NOTE:DURÉE (durée en doubles croches), « - » = silence.
//     « tempo » en battements par minute ; « basse » : une note fondamentale par demi-mesure.
//     « accel » (facultatif) : le tempo est multiplié par « facteur » à chaque reprise jusqu'à « max » ;
//     avec « cycle: true », il revient au tempo de départ une fois le maximum dépassé.
const MUSIQUES = [
  { nom: "1", tempo: 150, style: "pompe",
    chant: "E5:4 C5:2 D5:2 E5:2 G5:2 E5:4  D5:4 B4:2 C5:2 D5:2 F5:2 D5:4  C5:4 A4:2 B4:2 C5:2 E5:2 A5:4  G5:2 F5:2 E5:2 D5:2 E5:6 -:2 " +
           "A5:4 G5:2 E5:2 F5:4 D5:4  G5:4 F5:2 D5:2 E5:4 C5:4  F5:2 E5:2 D5:2 C5:2 B4:2 C5:2 D5:2 B4:2  A4:6 -:2 A4:2 B4:2 C5:2 D5:2",
    basse: "A2 A2 G2 G2 A2 A2 E2 E2 F2 F2 C3 C3 D3 E3 A2 A2" },
  { nom: "2", tempo: 112, style: "arpege",
    chant: "C5:4 E5:4 G5:4 E5:4  A5:6 G5:2 E5:8  F5:4 A5:4 G5:4 E5:4  D5:6 E5:2 D5:8 " +
           "C5:4 E5:4 G5:4 C6:4  B5:6 A5:2 G5:8  A5:4 F5:4 E5:4 D5:4  C5:12 -:4",
    basse: "C3 C3 F2 C3 F2 C3 G2 G2 C3 C3 G2 G2 F2 G2 C3 C3" },
  { nom: "3", tempo: 168, style: "pompe",
    chant: "D5:2 F5:2 A5:2 F5:2 D5:2 F5:2 A5:4  C5:2 E5:2 G5:2 E5:2 C5:2 E5:2 G5:4  Bb4:2 D5:2 F5:2 D5:2 Bb4:2 D5:2 F5:2 G5:2  A5:4 G5:2 F5:2 E5:4 C#5:4 " +
           "D5:2 D5:2 A5:4 G5:2 F5:2 E5:2 F5:2  G5:2 G5:2 C6:4 Bb5:2 A5:2 G5:2 A5:2  Bb5:4 A5:2 G5:2 F5:2 E5:2 D5:2 C#5:2  D5:8 -:4 A4:4",
    basse: "D3 D3 C3 C3 Bb2 Bb2 A2 A2 D3 D3 C3 C3 Bb2 A2 D3 D3" },
  // 4 : composition originale dans le style d'une danse russe, mineur puis majeur, accélère à chaque reprise
  { nom: "4", tempo: 132, style: "pompe", accel: { facteur: 1.04, max: 172, cycle: false },
    chant: "E5:2 F#5:2 G5:2 E5:2 B5:4 B5:4  A5:2 G5:2 F#5:2 G5:2 A5:4 F#5:4  G5:2 F#5:2 E5:2 D5:2 E5:2 F#5:2 G5:2 E5:2  F#5:4 B4:4 B4:8 " +
           "E5:2 F#5:2 G5:2 E5:2 C6:4 B5:4  A5:2 B5:2 A5:2 G5:2 F#5:4 D5:4  E5:2 G5:2 F#5:2 D#5:2 E5:4 B4:4  E5:8 -:4 D5:4 " +
           "G5:2 G5:2 B5:2 G5:2 D6:4 B5:4  C6:2 B5:2 A5:2 B5:2 C6:4 A5:4  B5:2 A5:2 G5:2 A5:2 B5:4 G5:4  A5:2 G5:2 F#5:2 E5:2 D5:4 -:2 D5:2 " +
           "G5:2 G5:2 B5:2 G5:2 D6:4 B5:4  E6:2 D6:2 C6:2 B5:2 A5:4 C6:4  B5:4 A5:2 F#5:2 G5:4 D5:4  G5:4 D5:2 B4:2 G4:4 B4:4",
    basse: "E2 E2 D3 D3 E2 C3 B2 B2 E2 C3 D3 D3 E2 B2 E2 D3 G2 G2 C3 C3 G2 G2 D3 D3 G2 G2 C3 A2 D3 D3 G2 D3" },
  // 5 : arrangement du refrain de « Kalinka » (chanson russe de 1860, domaine public) — part lentement,
  //     s'emballe à chaque reprise, puis repart lentement (mélodie reconstituée de mémoire)
  { nom: "5 KALINKA", tempo: 104, style: "pompe", accel: { facteur: 1.12, max: 210, cycle: true },
    chant: "A5:2 G5:2 F5:4 G5:2 F5:2 E5:4  F5:2 E5:2 D5:2 E5:2 F5:8  D5:2 C5:2 D5:2 E5:2 F5:2 G5:2 A5:4  A5:2 G5:2 F5:2 E5:2 D5:8 " +
           "A5:2 G5:2 F5:4 G5:2 F5:2 E5:4  F5:2 E5:2 D5:2 E5:2 F5:8  D5:2 C5:2 D5:2 E5:2 F5:2 G5:2 A5:4  A5:2 G5:2 F5:2 E5:2 D5:4 -:4",
    basse: "D3 A2 D3 D3 Bb2 C3 A2 D3 D3 A2 D3 D3 Bb2 C3 A2 D3" },
  // 6 : arrangement original de « Korobeiniki » (Les colporteurs), chanson populaire russe du XIXe siècle,
  //     domaine public. Seule la mélodie populaire est reprise ; l'accompagnement est une création originale.
  { nom: "6 KOROB", tempo: 144, style: "pompe",
    chant: "E5:4 B4:2 C5:2 D5:4 C5:2 B4:2  A4:4 A4:2 C5:2 E5:4 D5:2 C5:2  B4:6 C5:2 D5:4 E5:4  C5:4 A4:4 A4:8 " +
           "D5:6 F5:2 A5:4 G5:2 F5:2  E5:6 C5:2 E5:4 D5:2 C5:2  B4:4 B4:2 C5:2 D5:4 E5:4  C5:4 A4:4 A4:8",
    basse: "E2 E2 A2 A2 E2 E2 A2 A2 D3 D3 C3 C3 E2 E2 A2 A2" }
];

/* =====================================================================================
   À partir d'ici : le moteur du jeu
   ===================================================================================== */
const LARGEUR = 10, HAUTEUR = 18, T = 8;       // grille 10 × 18, cases de 8 pixels
const CHAMP_X = 8;                              // position de la grille dans l'écran 160 × 144
const PANNEAU_X = 96;

const canvas = document.getElementById("ecran");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
try { document.title = NOM_DU_JEU; } catch (e) {}

/* ---------- Dessin de base ---------- */
let PAL = PALETTE;   // palette active (rétro, couleur, ou scènes en couleur)
function couleurActive() { return P.ecran === "couleur"; }
function rect(x, y, w, h, c) { ctx.fillStyle = PAL[c]; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
function px(x, y, c) { ctx.fillStyle = PAL[c]; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function cadre(x, y, w, h, fond, bord) { rect(x, y, w, h, bord); rect(x + 1, y + 1, w - 2, h - 2, fond); }
function ellipse(cx, cy, rx, ry, f) {
  for (let y = -ry; y <= ry; y++) {
    const d = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.01))));
    for (let x = -d; x <= d; x++) { const c = f(x, y); if (c >= 0) px(cx + x, cy + y, c); }
  }
}

/* ---------- Police pixel 5 × 7 (création originale) ---------- */
const POLICE_SOURCE = {
  A: "01110 10001 10001 11111 10001 10001 10001", B: "11110 10001 10001 11110 10001 10001 11110",
  C: "01110 10001 10000 10000 10000 10001 01110", D: "11110 10001 10001 10001 10001 10001 11110",
  E: "11111 10000 10000 11110 10000 10000 11111", F: "11111 10000 10000 11110 10000 10000 10000",
  G: "01110 10001 10000 10111 10001 10001 01111", H: "10001 10001 10001 11111 10001 10001 10001",
  I: "01110 00100 00100 00100 00100 00100 01110", J: "00111 00010 00010 00010 00010 10010 01100",
  K: "10001 10010 10100 11000 10100 10010 10001", L: "10000 10000 10000 10000 10000 10000 11111",
  M: "10001 11011 10101 10101 10001 10001 10001", N: "10001 11001 10101 10011 10001 10001 10001",
  O: "01110 10001 10001 10001 10001 10001 01110", P: "11110 10001 10001 11110 10000 10000 10000",
  Q: "01110 10001 10001 10001 10101 10010 01101", R: "11110 10001 10001 11110 10100 10010 10001",
  S: "01111 10000 10000 01110 00001 00001 11110", T: "11111 00100 00100 00100 00100 00100 00100",
  U: "10001 10001 10001 10001 10001 10001 01110", V: "10001 10001 10001 10001 10001 01010 00100",
  W: "10001 10001 10001 10101 10101 11011 10001", X: "10001 10001 01010 00100 01010 10001 10001",
  Y: "10001 10001 01010 00100 00100 00100 00100", Z: "11111 00001 00010 00100 01000 10000 11111",
  "0": "01110 10001 10011 10101 11001 10001 01110", "1": "00100 01100 00100 00100 00100 00100 01110",
  "2": "01110 10001 00001 00110 01000 10000 11111", "3": "11110 00001 00001 01110 00001 00001 11110",
  "4": "00010 00110 01010 10010 11111 00010 00010", "5": "11111 10000 11110 00001 00001 10001 01110",
  "6": "00110 01000 10000 11110 10001 10001 01110", "7": "11111 00001 00010 00100 01000 01000 01000",
  "8": "01110 10001 10001 01110 10001 10001 01110", "9": "01110 10001 10001 01111 00001 00010 01100",
  ".": "00000 00000 00000 00000 00000 01100 01100", ":": "00000 01100 01100 00000 01100 01100 00000",
  "-": "00000 00000 00000 11111 00000 00000 00000", "!": "00100 00100 00100 00100 00100 00000 00100",
  "?": "01110 10001 00001 00110 00100 00000 00100", "/": "00001 00001 00010 00100 01000 10000 10000",
  "<": "00010 00100 01000 10000 01000 00100 00010", ">": "01000 00100 00010 00001 00010 00100 01000",
  "+": "00000 00100 00100 11111 00100 00100 00000", "'": "00100 00100 01000 00000 00000 00000 00000",
  "*": "00000 10101 01110 11111 01110 10101 00000"
};
const POLICE = {};
for (const k in POLICE_SOURCE) POLICE[k] = POLICE_SOURCE[k].replace(/ /g, "");
function nettoyer(s) { return String(s).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function texte(s, x, y, c, ech) {
  ech = ech || 1; s = nettoyer(s); ctx.fillStyle = typeof c === "string" ? c : PAL[c];
  for (let i = 0; i < s.length; i++) {
    const g = POLICE[s[i]];
    if (g) for (let j = 0; j < 35; j++) if (g[j] === "1") ctx.fillRect(x + (i * 6 + j % 5) * ech, y + ((j / 5) | 0) * ech, ech, ech);
  }
}
function largeurTexte(s, ech) { return (String(s).length * 6 - 1) * (ech || 1); }
function texteCentre(s, y, c, ech, x0, w) {
  if (x0 === undefined) { x0 = 0; w = 160; }
  texte(s, x0 + Math.floor((w - largeurTexte(s, ech)) / 2), y, c, ech);
}
function texteDroite(s, xd, y, c) { texte(s, xd - largeurTexte(s), y, c); }

/* ---------- Motifs des cases (une texture par pièce, lisible sans couleur) ---------- */
// 1=L 2=J 3=I 4=O 5=Z 6=S 7=T 8=rideau/blocs de départ 9=mur
function motif(t, x, y) {
  const b = (x === 0 || y === 0 || x === 7 || y === 7);
  const centre = (x >= 3 && x <= 4 && y >= 3 && y <= 4);

function logiqueJeu() {
  if (appuis.start) { etat = "pause"; arreterMusique(); sfx.pause(); return; }
  if (J.phase === "clignote") { if (++J.cpt >= DELAI_LIGNES_IMAGES) retirerLignes(); return; }
  if (J.phase === "are") { if (--J.cpt <= 0) nouvellePiece(); return; }
  const p = J.piece;
  // 1. Rotation : si la place n'est pas libre, la pièce ne tourne pas (aucun décalage automatique)
  let sens = 0;
  if (appuis.a) sens = SENS_BOUTON_A; else if (appuis.b) sens = -SENS_BOUTON_A;
  if (sens) {
    const n = FORMES[p.type].length, r = (p.rot + sens + n) % n;
    if (n > 1 && !collision(p.type, r, p.x, p.y)) { p.rot = r; sfx.tourner(); }
  }
  // 2. Déplacement latéral avec délai puis répétition
  if (appuis.gauche) { J.dir = -1; J.das = 0; deplacer(-1); }
  else if (appuis.droite) { J.dir = 1; J.das = 0; deplacer(1); }
  else if (J.dir && ((J.dir < 0 && tenu.gauche) || (J.dir > 0 && tenu.droite))) {
    if (++J.das >= DAS_DELAI) { deplacer(J.dir); J.das = DAS_DELAI - DAS_PERIODE; }
  } else { J.dir = tenu.gauche ? -1 : tenu.droite ? 1 : 0; J.das = 0; }
  // 3. Descente : rapide (bas maintenu) ou gravité du niveau. Si la pièce ne peut plus descendre, elle se fige.
  if (appuis.bas) J.descenteArmee = true;
  if (!tenu.bas) { J.descenteArmee = false; J.ptsDescente = 0; J.cptDescente = 0; }
  let descendre = false, rapide = false;
  if (J.descenteArmee && tenu.bas) { if (++J.cptDescente >= DESCENTE_RAPIDE_IMAGES) { J.cptDescente = 0; descendre = true; rapide = true; } }
  if (++J.gravite >= VITESSES[Math.min(J.niveau, VITESSES.length - 1)]) { descendre = true; }
  if (descendre) {
    J.gravite = 0;
    if (!collision(p.type, p.rot, p.x, p.y + 1)) { p.y++; if (rapide) J.ptsDescente++; }
    else verrouiller();
  }
}

function demarrerRecompense(palier) {

  for (let i = 0; i < 46; i++) R.etoiles.push({ x: Math.floor(Math.random() * 160), y: Math.floor(Math.random() * 118), ph: Math.floor(Math.random() * 4), v: 1 + Math.floor(Math.random() * 3) });

  for (let k = 0; k < 14; k++) { const a = k * Math.PI / 7; px(x + Math.cos(a) * r, y + Math.sin(a) * r + age * age * 0.006, age < 26 ? c1 : c2); }
  if (age < 16) for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + 0.3; px(x + Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.5, c2); }
}
function faisceau(x0, y0, angle, longueur, c) {
  for (let r = 6; r < longueur; r++) {
    const x = x0 + Math.cos(angle) * r, y = y0 - Math.sin(angle) * r, l = 1 + r / 9;
    for (let k = -l; k <= l; k++) { const X = Math.round(x + k), Y = Math.round(y); if ((X + Y) % 2 === 0 && Y < 128) px(X, Y, c); }
  }
}

function logiqueRecompense() {

/* ---------- Logique des écrans ---------- */
function logique() {
  horloge++;
  lireManette();
  switch (etat) {
    case "titre":
      if (appuis.start || appuis.a) { etat = "reglages"; ligneReglage = 0; sfx.valider(); jouerMusique(P.musique); }
      break;
    case "reglages": logiqueReglages(); break;
    case "jeu": logiqueJeu(); break;
    case "pause":
      if (appuis.start) { etat = "jeu"; sfx.pause(); jouerMusique(P.musique); }
      break;
    case "fin":
      J.cptFin++;
      if (J.cptFin > HAUTEUR * RIDEAU_IMAGES_PAR_LIGNE + 40 && (appuis.start || appuis.a)) {
        const p = J.mode === "A" ? palierAtteint(J.score) : 0;
        if (p) demarrerRecompense(p); else { etat = "scores"; sfx.valider(); }
      }
      break;
    case "reussite":
      J.cptFin++;
      if (J.cptFin > 90 && (appuis.start || appuis.a)) { etat = "scores"; sfx.valider(); }
      break;
    case "recompense": logiqueRecompense(); break;
    case "scores":
      if (appuis.start || appuis.a) { etat = "reglages"; ligneReglage = 0; sfx.valider(); jouerMusique(P.musique); }
      else if (appuis.b) { etat = "titre"; sfx.menu(); }
      break;
  }
  appuis = {};
}
function lignesReglage() { return P.mode === "B" ? [0, 1, 2, 3, 4] : [0, 1, 2, 4]; }
function logiqueReglages() {
  const L = lignesReglage();
  let pos = L.indexOf(ligneReglage); if (pos < 0) { pos = 0; ligneReglage = L[0]; }
  if (appuis.haut) { ligneReglage = L[(pos + L.length - 1) % L.length]; sfx.menu(); }
  if (appuis.bas) { ligneReglage = L[(pos + 1) % L.length]; sfx.menu(); }
  const dx = appuis.gauche ? -1 : appuis.droite ? 1 : 0;
  if (dx) {
    if (ligneReglage === 0) P.mode = P.mode === "A" ? "B" : "A";
    else if (ligneReglage === 1) { const nbM = MUSIQUES.length + 1; let i = P.musique < 0 ? nbM - 1 : P.musique; i = (i + dx + nbM) % nbM; P.musique = i === nbM - 1 ? -1 : i; jouerMusique(P.musique); }
    else if (ligneReglage === 2) { const k = P.mode === "A" ? "niveauA" : "niveauB"; P[k] = (P[k] + dx + 10) % 10; }
    else if (ligneReglage === 3) P.hauteur = (P.hauteur + dx + 6) % 6;
    else P.ecran = P.ecran === "couleur" ? "retro" : "couleur";
    sfx.menu(); sauver();
  }
  if (appuis.start || appuis.a) { sfx.valider(); lancerPartie(); }
  else if (appuis.b) { etat = "titre"; arreterMusique(); sfx.menu(); }
}

  texte("NIV", 3, 23, 3); texteDroite(String(J.niveau), 58, 23, 3);
  const b = J.mode === "B";
  texte(b ? "RESTE" : "LIG", 3, 32, 3); texteDroite(String(b ? Math.max(0, LIGNES_MODE_B - J.lignes) : J.lignes), 58, 32, 3);
  cadre(61, 2, 34, 36, 0, 3);
  if (etat !== "pause") {
    const f = FORMES[J.suivante][0];
    let x0 = 9, x1 = 0, y0 = 9, y1 = 0;
    f.forEach(c => { x0 = Math.min(x0, c[0]); x1 = Math.max(x1, c[0]); y0 = Math.min(y0, c[1]); y1 = Math.max(y1, c[1]); });
    const ox = 78 - ((x1 - x0 + 1) * T) / 2 - x0 * T, oy = 20 - ((y1 - y0 + 1) * T) / 2 - y0 * T;
    f.forEach(c => tuile(J.suivante + 1, ox + c[0] * T, oy + c[1] * T));
  }
}
function dessinerJeuPortrait() {
  dessinerBandeau();
  ctx.save(); ctx.translate(0, 40); dessinerJeu(); ctx.restore();
}
let classeCouleur = null;
function dessiner() {
  const portrait = dispositionPortrait() && (etat === "jeu" || etat === "pause" || etat === "fin");
  const W = portrait ? 96 : 160, H = portrait ? 184 : 144;
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; ctx.imageSmoothingEnabled = false; ajusterTaille(); }
  const c = couleurActive();
  PAL = !c ? PALETTE : (etat === "recompense" ? PALETTE_SCENES_COULEUR : PALETTE_COULEUR);
  if (c !== classeCouleur) { classeCouleur = c; document.body.classList.toggle("couleur", c); }
  switch (etat) {
    case "titre": dessinerTitre(); break;
    case "reglages": dessinerReglages(); break;
    case "jeu": case "pause": case "fin": if (portrait) dessinerJeuPortrait(); else dessinerJeu(); break;
    case "reussite": dessinerReussite(); break;
    case "recompense": dessinerRecompense(); break;
    case "scores": dessinerScores(); break;
  }
}

/* ---------- Boucle principale : logique à cadence fixe, dessin à chaque rafraîchissement ---------- */
const PAS = 1000 / IMAGES_PAR_SECONDE;
let dernier = 0, reserve = 0;
function boucle(maintenant) {
  if (!dernier) dernier = maintenant;
  reserve += Math.min(250, maintenant - dernier); dernier = maintenant;
  while (reserve >= PAS) { logique(); reserve -= PAS; }
  dessiner();
  requestAnimationFrame(boucle);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden && etat === "jeu") { etat = "pause"; arreterMusique(); }
  dernier = 0;
});
ajusterTaille();
requestAnimationFrame(boucle);

// Installation sur téléphone : active le mode hors connexion quand le jeu est servi par un site web
// (sans effet quand on ouvre simplement le fichier depuis l'ordinateur)
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
